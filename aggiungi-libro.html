<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Aggiungi Libro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BOOTSTRAP ICONS (per l’hamburger) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- NAVBAR  -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Logo + link menu desktop -->
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand d-flex align-items-center mb-0" href="./index.html">
                    <img src="img/duck.png" alt="Logo" height="48">
                </a>

                <!-- Menu desktop -->
                <ul class="navbar-nav flex-row d-none d-xl-flex">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Catalogo Libri</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link" href="#">Anagrafica Utenti</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link" href="#">Storico Prestiti</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link" href="#">Help</a>
                    </li>
                </ul>
            </div>

            <!-- Search bar desktop -->
            <form class="d-none d-xl-flex align-items-center" role="search">
                <input class="form-control form-control-sm me-2" type="search" placeholder="Cerca..."
                    aria-label="Cerca">
                <button class="btn btn-outline-light btn-sm" type="submit">Cerca</button>
            </form>

            <!-- Hamburger mobile+tablet -->
            <button class="btn btn-outline-light border-0 d-xl-none" type="button">
                <i class="bi bi-list fs-3"></i>
            </button>
        </div>
    </nav>

    <!-- CONTENUTO PAGINA -->
    <div class="container py-4">

        <!-- Titolo -->
        <h1 class="h3 mb-4">Nuovo Libro</h1>

        <!-- FORM -->
        <form>

            <!-- Nome / Cognome autore -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nomeAutore" class="form-label">Nome Autore</label>
                    <input type="text" class="form-control" id="nomeAutore" placeholder="Inserisci il nome dell'autore">
                </div>
                <div class="col-md-6">
                    <label for="cognomeAutore" class="form-label">Cognome Autore</label>
                    <input type="text" class="form-control" id="cognomeAutore"
                        placeholder="Inserisci il cognome dell'autore">
                </div>
            </div>

            <!-- Titolo -->
            <div class="mb-2">
                <label for="titoloLibro" class="form-label">Titolo</label>
                <input type="text" class="form-control" id="titoloLibro" placeholder="Inserisci il titolo del libro">
            </div>
            <div class="mb-4">
                <small class="text-muted">Titolo versione italiana</small>
            </div>

            <!-- Genere / Anno / ISBN -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="genere" class="form-label">Genere</label>
                    <select class="form-select" id="genere">
                        <option selected>Scegli il genere</option>
                        <option>Fantasy</option>
                        <option>Romanzo</option>
                        <option>Thriller</option>
                        <option>Saggio</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="anno" class="form-label">Anno di Pubblicazione</label>
                    <input type="text" class="form-control" id="anno" placeholder="Inserisci l'anno">
                </div>
                <div class="col-md-4">
                    <label for="isbn" class="form-label">ISBN#</label>
                    <input type="text" class="form-control" id="isbn" placeholder="Inserisci il codice ISBN#">
                </div>
            </div>

            <!-- Separatore -->
            <hr class="my-4">

            <!-- Note -->
            <div class="mb-3">
                <label for="note" class="form-label">Note</label>
                <textarea class="form-control" id="note" rows="4"
                    placeholder="Inserisci eventuali note sul libro"></textarea>
            </div>

            <!-- Checkbox -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="digitale">
                <label class="form-check-label" for="digitale">
                    Disponibile anche in digitale
                </label>
            </div>

            <!-- Bottone -->
            <button type="submit" class="btn btn-primary">Aggiungi Libro</button>

        </form>

    </div>

</body>

</html>
